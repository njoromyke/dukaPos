version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dukapos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: src/DukaPoS.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=dukapos;Username=postgres;Password=postgres"
      Jwt__Key: "DukaPoS-Dev-Secret-Key-Change-In-Production-2024-Must-Be-At-Least-32-Chars!"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
